# Robot que mantiene la web al día sin que tengas que hacer nada.
# Cada 4 horas lee tu web original e inacross-guide, y si hay cambios
# los guarda en data/. Cloudflare publica la nueva versión y las apps
# instaladas se actualizan solas.
name: Sincronizar datos
on:
  schedule:
    - cron: '17 */4 * * *'   # cada 4 horas (hora UTC)
  workflow_dispatch:          # botón «Run workflow» para lanzarlo a mano
permissions:
  contents: write
concurrency:
  group: sincronizar
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer las webs y actualizar los datos
        run: node tools/sincronizar.mjs
      - name: Publicar los cambios
        run: |
          git config user.name "robot-iecross"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tools/fuentes
          for d in players coaches news; do if [ -d "$d" ]; then git add "$d"; fi; done
          if git diff --cached --quiet; then echo "Nada nuevo que publicar"; exit 0; fi
          git commit -m "Datos sincronizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
